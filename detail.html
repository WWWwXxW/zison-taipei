<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="自送店家詳情" />
  <title>店家詳情｜自送</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20261003-storepage" />
  <script>
    window.goatcounter = {
      no_onload: ("doNotTrack" in navigator && navigator.doNotTrack === "1")
    };
  </script>
  <script data-goatcounter="https://zisong.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
</head>
<body class="page-detail">
  <a class="skip-link" href="#main">跳至主要內容</a>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html" aria-label="自送 zisong 首頁"><span class="brand-name">自送</span><span class="brand-roman">zisong</span></a>
      <nav class="nav" aria-label="主要導覽"><a href="index.html">店家目錄</a><a href="about.html">關於自送</a></nav>
    </div>
  </header>

  <main class="wrap" id="main">
    <div id="detail">載入中…</div>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <p>© 自送 — 請至餐廳官方通道完成訂購。</p>
      <div class="footer-reports" id="footer-reports">
        <p>
          <button type="button" class="report-toggle" data-report-open="suggest">建議加店</button>
          <span aria-hidden="true"> · </span>
          <button type="button" class="report-toggle" data-report-open="problem">通報有問題</button>
        </p>
        <form id="form-suggest" class="report-form" hidden>
          <p class="report-form-title">建議加店</p>
          <label>店名<input name="name" required maxlength="80" autocomplete="organization" /></label>
          <label>縣市／行政區<input name="place" required maxlength="60" placeholder="例如：新竹縣 竹北市" /></label>
          <label>官方訂餐連結或電話<input name="contact" required maxlength="200" placeholder="https:// 或電話" /></label>
          <label>補充<textarea name="note" maxlength="500" rows="3"></textarea></label>
          <button type="submit" class="btn btn-primary">用郵件寄出</button>
        </form>
        <form id="form-problem" class="report-form" hidden>
          <p class="report-form-title">通報有問題</p>
          <label>哪一家<input name="shop" required maxlength="80" /></label>
          <label>問題類型
            <select name="kind" required>
              <option value="">請選擇</option>
              <option>連結失效</option>
              <option>資料錯</option>
              <option>不是自送</option>
              <option>照片不對</option>
            </select>
          </label>
          <label>補充<textarea name="note" maxlength="500" rows="3"></textarea></label>
          <button type="submit" class="btn btn-primary">用郵件寄出</button>
        </form>
      </div>
    </div>
  </footer>

  <script src="data.js?v=20261003-storepage"></script>
  <script src="app.js?v=20261003-storepage"></script>
</body>
</html>
